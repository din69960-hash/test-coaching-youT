        <div class="name">${esc(v.title)}</div>
        <div class="yt-actions">
          <button class="btn sm ghost" data-edit>Modifier</button>
          <button class="btn sm ghost" data-move>Déplacer</button>
          <button class="btn sm danger" data-del>Suppr.</button>
        </div></div></div>`);
    it.querySelector('[data-play]').onclick=()=>playYouTube(v);
    it.querySelector('[data-edit]').onclick=()=>videoModal(v,folderId,here);
    it.querySelector('[data-del]').onclick=()=>confirmModal('Supprimer',`Retirer « ${v.title} » ? (La vidéo reste sur YouTube.)`,async()=>{
      S.formation.videos=S.formation.videos.filter(x=>x.id!==v.id); await saveFormation(); here();
    });
    it.querySelector('[data-move]').onclick=()=>{
      const b=el(`<div><label class="fld">Déplacer vers</label>
        <select class="inp">${FT.sorted().map(f=>`<option value="${f.id}" ${f.id===v.folder?'selected':''}>${esc(FT.label(f.id))}</option>`).join('')}</select>
        <div class="spacer"></div><div class="btnrow" style="justify-content:flex-end">
        <button class="btn ghost" data-x>Annuler</button><button class="btn" data-ok>Déplacer</button></div></div>`);
      b.querySelector('[data-x]').onclick=closeModal;
      b.querySelector('[data-ok]').onclick=async()=>{
        const to=b.querySelector('select').value;
        if(to!==v.folder){ v.folder=to; v.order=Math.max(-1,...S.formation.videos.filter(x=>x.folder===to&&x!==v).map(x=>x.order??0))+1; await saveFormation(); toast('Vidéo déplacée'); }
        closeModal(); here();
      };
      modal('Déplacer la vidéo',b);
    };
    list.appendChild(it);
  });
  n.appendChild(list);
  makeSortable(list,'.yt-item',(from,to)=>{
    arrayMove(vids,from,to); vids.forEach((v,i)=>v.order=i); saveFormation(); here();
  });
  return n;
}
function formationScreen(){
  const n=el('<div></div>');
  const tab=S.params.tab||'agres';
  n.appendChild(header('Formation',null,[
    {label:'Accueil',to:()=>{S.role=null;nav('home');}},
    {label:'Entraîneur',to:()=>nav('trainerHome')},
    {label:'Formation'}
  ]));
  const tabs=el(`<div class="pill-tabs">
    <button data-t="agres">Formation par agrès</button>
    <button data-t="media">Médiathèque</button></div>`);
  tabs.querySelectorAll('button').forEach(b=>{ if(b.dataset.t===tab) b.classList.add('on'); b.onclick=()=>nav('formation',{tab:b.dataset.t}); });
  n.appendChild(tabs);

  if(tab==='agres'){
    const app=S.params.app;
    if(!app){
      n.appendChild(el('<p class="muted" style="margin-top:-4px">Choisis un agrès pour voir ses vidéos de formation.</p>'));
      const t=el('<div class="apparatus-tabs"></div>');
      APPARATUS.forEach(a=>{
        const b=el(`<button class="atab ${a.cls}">${a.label}<small>${FT.countDeep(a.key)} vidéo(s)</small></button>`);
        b.onclick=()=>nav('formation',{tab:'agres',app:a.key});
        t.appendChild(b);
      });
      n.appendChild(t);
      return n;
    }
    const go=id=> id ? nav('formation',{tab:'agres',app,folder:id}) : nav('formation',{tab:'agres'});
    n.appendChild(formationFolderView(S.params.folder||app, go, app));
    return n;
  }

  // Médiathèque de formation
  const go=id=> id ? nav('formation',{tab:'media',folder:id}) : nav('formation',{tab:'media'});
  if(S.params.folder){ n.appendChild(formationFolderView(S.params.folder, go, null)); return n; }
  n.appendChild(el('<p class="muted" style="margin-top:-4px">Range tes vidéos YouTube de formation par dossier et sous-dossier.</p>'));
  const bar=el(`<div class="btnrow" style="margin-bottom:14px"><button class="btn" data-addf>＋ Ajouter un dossier</button></div>`);
  bar.querySelector('[data-addf]').onclick=()=>promptModal('Nouveau dossier','Nom du dossier',{placeholder:'ex. Préparation physique',okText:'Créer',onOk:async name=>{
    S.formation.folders.push({id:uid(),name:name.trim(),parent:null}); await saveFormation(); closeModal(); go(null);
  }});
  n.appendChild(bar);
  n.appendChild(formationFolderGrid(null, go, ()=>go(null)));
  return n;
}

/* ============================================================
   ADMIN
   ============================================================ */
function adminScreen(){
  const n=el('<div></div>');
  n.appendChild(header('Administrateur',null,[{label:'Accueil',to:()=>{S.role=null;nav('home');}},{label:'Admin'}]));

  // Cloud / synchronisation
  const cloudCard=el(`<div class="card">
    <h2 style="margin-top:2px">Cloud (synchronisation)</h2>
    <p class="muted" style="margin-top:0">Etat : <b class="cloudstate"></b>. Les donnees (gyms, programmes, reglages) sont partagees entre tous les appareils. Les videos restent locales pour l'instant (etape suivante : R2).</p>
    <div class="flex" style="flex-wrap:wrap;gap:8px">
      <button class="btn sm" data-push>\u2b06 Envoyer mes donnees vers le cloud</button>
      <button class="btn sm ghost" data-pull>\u2b07 Recharger depuis le cloud</button>
    </div></div>`);
  const setCState=()=>{ const b=cloudCard.querySelector('.cloudstate'); if(!CLOUD_ENABLED){b.textContent="desactive (hors-ligne)";b.style.color="#6b7391";} else if(Cloud.online){b.textContent="connecte";b.style.color="#2e9e5b";} else {b.textContent="non connecte";b.style.color="#c8302f";} };
  setCState();
  cloudCard.querySelector('[data-push]').onclick=async()=>{ if(!CLOUD_ENABLED){toast("Cloud indisponible");return;} toast("Envoi en cours..."); try{ await pushAllToCloud(); setCState(); toast("Donnees envoyees au cloud"); }catch(e){ console.warn(e); toast("Echec de l envoi"); } };
  cloudCard.querySelector('[data-pull]').onclick=async()=>{ if(!CLOUD_ENABLED){toast("Cloud indisponible");return;} toast("Chargement..."); try{ const c=await Cloud.pullEverything(); Cloud.online=true; S.gymnasts=c.gymnasts; S.programs=c.programs; S.fullPrograms=c.fullPrograms; if(c.settings)S.settings={...DEFAULT_SETTINGS,...c.settings}; S.folders=normalizeFolders(c.folders); S.gymFolders=c.gymFolders||[]; S.formation=normalizeFormation(c.formation); S.media=c.media||[]; await migratePasswords(); await cacheToLocal(); paintCloudBadge(); nav("admin"); toast("Recharge depuis le cloud"); }catch(e){ console.warn(e); Cloud.online=false; paintCloudBadge(); toast("Echec du chargement"); } };
  n.appendChild(cloudCard);


  // Passwords
  const pw=el(`<div class="card">
    <h2 style="margin-top:2px">Mots de passe</h2>
    <div style="max-width:360px">
      <p class="muted" style="margin-top:0;font-size:12.5px">Les mots de passe ne sont plus stockés en clair : saisis-en un nouveau pour le changer.</p>
      <label class="fld">Nouveau mot de passe entraîneur</label>
      <div class="flex"><input class="inp grow" id="tp" type="password" autocomplete="new-password" placeholder="••••••••"><button class="btn sm" data-savet>OK</button></div>
      <div class="spacer"></div>
      <label class="fld">Nouveau mot de passe administrateur</label>
      <div class="flex"><input class="inp grow" id="ap" type="password" autocomplete="new-password" placeholder="••••••••"><button class="btn sm" data-savea>OK</button></div>
    </div></div>`);
  pw.querySelector('[data-savet]').onclick=async()=>{ const v=pw.querySelector('#tp').value.trim(); if(!v)return; S.settings.trainerHash=await hashPass(v); await saveSettings(); pw.querySelector('#tp').value=''; toast('Mot de passe entraîneur changé'); };
  pw.querySelector('[data-savea]').onclick=async()=>{ const v=pw.querySelector('#ap').value.trim(); if(!v)return; S.settings.adminHash=await hashPass(v); await saveSettings(); pw.querySelector('#ap').value=''; toast('Mot de passe administrateur changé'); };
  n.appendChild(pw);

  // Logo
  const lg=el(`<div class="card"><h2 style="margin-top:2px">Logo d’accueil</h2>
    <p class="muted" style="margin-top:0">Image affichée en plein écran sur la page d’accueil.</p>
    <div class="flex">
      <label class="btn sm ghost">Choisir un logo<input type="file" accept="image/*" hidden></label>
      ${S.logo?'<button class="btn sm danger" data-rmlogo>Retirer</button>':''}
      ${S.logo?`<img src="${S.logo}" style="height:44px;margin-left:auto">`:''}
    </div></div>`);
  lg.querySelector('input').onchange=async(e)=>{ const f=e.target.files[0]; if(!f)return; await DB.put('kv',{id:'logo',blob:f}); if(S.logo)URL.revokeObjectURL(S.logo); S.logo=URL.createObjectURL(f); toast('Logo mis à jour'); nav('admin'); };
  const rm=lg.querySelector('[data-rmlogo]'); if(rm) rm.onclick=async()=>{ await DB.del('kv','logo'); if(S.logo)URL.revokeObjectURL(S.logo); S.logo=null; nav('admin'); };
  n.appendChild(lg);

  // Manage gyms
  const gy=el(`<div class="card"><h2 style="margin-top:2px">Gestion des programmes</h2></div>`);
  if(!S.gymnasts.length) gy.appendChild(el('<div class="muted">Aucun programme.</div>'));
  S.gymnasts.slice().sort((a,b)=>a.name.localeCompare(b.name)).forEach(g=>{
    ensureSessions(g);
    const it=el(`<div class="list-item"><div class="name">${esc(g.name)}</div>
      <div class="meta">${g.sessions.length?g.sessions.length+' séance(s)':''}</div>
      <button class="btn sm ghost" data-reset>Réinit. séances</button>
      <button class="btn sm danger" data-del>Suppr.</button></div>`);
    it.querySelector('[data-reset]').onclick=()=>confirmModal('Réinitialiser',`Effacer toutes les séances de ${g.name} ?`,async()=>{ g.sessions=[]; await saveGym(g); nav('admin'); },{yesText:'Effacer',danger:false});
    it.querySelector('[data-del]').onclick=()=>confirmModal('Supprimer',`Supprimer ${g.name} ?`,async()=>{ await DB.del('gymnasts',g.id); cloudRemove('gymnasts',g.id); S.gymnasts=S.gymnasts.filter(x=>x.id!==g.id); nav('admin'); });
    gy.appendChild(it);
  });
  n.appendChild(gy);

  // Media shortcut
  const md=el(`<div class="card"><h2 style="margin-top:2px">Médiathèque</h2>
    <p class="muted" style="margin-top:0">Ajouter, déplacer, supprimer dossiers et médias.</p>
    <button class="btn" data-media>Ouvrir la médiathèque</button></div>`);
  md.querySelector('[data-media]').onclick=()=>{ S.role='admin'; nav('build',{tab:'media'}); };
  n.appendChild(md);
  return n;
}

   ROUTES

const ROUTES = {
  trainerHome, gyms:gymsScreen, gymProfile, build:buildScreen, formation:formationScreen, admin:adminScreen
};

/* ============================================================
   Boot
   ============================================================ */
async function boot(){
  await DB.open();
  await loadAll();
  await migratePasswords();
  // ensure kv defaults saved
  if(!(await DB.get('kv','settings'))) await saveSettings();
  if(!(await DB.get('kv','folders'))) await saveFolders();
  render();
}
boot();
return {S,nav};
})();
